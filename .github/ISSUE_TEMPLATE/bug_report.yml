name: Bug report
description: Something isn't working — a wrong number, a crash, an unexpected exception, a broken example.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much of the form as you can — the more precise the reproduction, the faster it can be fixed.

        Before opening: please search existing issues to check this hasn't already been reported.

  - type: input
    id: geopulse-version
    attributes:
      label: GeoPulse version
      description: Output of `python -c "import geopulse; print(geopulse.__version__)"`.
      placeholder: "0.1.0a3"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.11.8"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS name + version.
      placeholder: "Ubuntu 24.04, macOS 14.5, Windows 11"
    validations:
      required: true

  - type: dropdown
    id: install-mode
    attributes:
      label: How was GeoPulse installed?
      options:
        - "pip install geopulse (PyPI)"
        - "pip install -e . (editable, git clone)"
        - "conda env from environment.yml"
        - "other (describe below)"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen? If you expected a specific numerical value (e.g. a published GIC number), please include a paper citation.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include full tracebacks in fenced code blocks.
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest self-contained script that reproduces the bug. Please avoid attaching large data files — synthesise inputs where possible.
      render: python
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, links, related issues. Optional.
