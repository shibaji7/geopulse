name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff mypy
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/geopulse/ --ignore-missing-imports

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -m "not slow and not benchmark" --cov=geopulse --cov-report=xml --cov-report=term

  # Dedicated coverage upload job. Runs once (Linux + 3.12) so we don't
  # spam Codecov with duplicate reports across the OS × Python matrix.
  coverage:
    name: Coverage → Codecov
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Run coverage
        run: pytest tests/ -m "not slow and not benchmark" --cov=geopulse --cov-report=xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false     # don't fail the whole run if Codecov flakes
          # No token needed for public repos; Codecov uses tokenless upload
          # from GitHub Actions when the repo is public and Codecov's GH
          # App is installed.
