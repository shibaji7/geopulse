name: Nightly
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --cov=geopulse --cov-report=xml
