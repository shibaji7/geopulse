# Default stage for hooks that don't set one explicitly. Keeps historical
# behaviour (fast lint/format/type checks on every commit).
default_stages: [pre-commit]

# Install with:
#   pre-commit install                     # pre-commit stage (default)
#   pre-commit install --hook-type commit-msg   # for gitlint
#   pre-commit install --hook-type pre-push     # for the wheel/docs smoke checks

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match the dev env (local ruff is 0.16.0). Bump both together
    # when refreshing; `pre-commit autoupdate` handles this hook automatically.
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # Match the CI invocation: mypy src/geopulse/ --ignore-missing-imports.
        # Scoped to src/ only so noisier test code doesn't gate every commit.
        files: ^src/geopulse/
        args: [--ignore-missing-imports]

  # ----- Guardrails: docstring coverage + signature/docstring consistency -
  #
  # interrogate: fails if docstring coverage across src/ drops below the
  # threshold. Reports a per-file table on failure so you can see exactly
  # which new function is missing a docstring.
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [-v, --fail-under=85, --ignore-init-method, --ignore-magic,
               --ignore-nested-functions, src/geopulse/]
        pass_filenames: false
        stages: [pre-commit]

  # pydoclint was evaluated in an earlier PR but is deliberately NOT
  # enabled. It insists on "type hints in signature XOR docstring", but
  # the project follows numpy/scipy convention: hints go in BOTH the
  # signature (for tools) and the docstring (for humans). Pydoclint
  # flagged ~50 items as DOC111 "docstring has type hints" — that's not
  # drift, it's the convention. numpydoc-validation was evaluated too and
  # hit a similar false-positive wall on frozen-dataclass `Attributes`
  # sections. See scripts/check_docstring_drift.py for the narrowly
  # scoped, convention-respecting replacement (GH-17).
  - repo: local
    hooks:
      - id: check-docstring-drift
        name: check docstring/signature drift (src/geopulse/ only)
        entry: python scripts/check_docstring_drift.py
        language: system
        pass_filenames: false
        files: ^src/geopulse/.*\.py$
        stages: [pre-commit]

  # ----- Local hooks (project-specific shell commands) --------------------
  - repo: local
    hooks:
      # 0. Version-drift check: fail if the current live version literal
      # (read from src/geopulse/_version.py) appears anywhere it shouldn't.
      # The only allowed places are _version.py itself and CHANGELOG.md.
      # See scripts/check_no_version_drift.py for the full rationale.
      - id: check-no-version-drift
        name: check no hardcoded version literals
        entry: python scripts/check_no_version_drift.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # 0.5 Duplicate-code check: narrowly-scoped pylint invocation that
      # ONLY runs the duplicate-code (R0801) checker on src/geopulse/.
      # See .pylintrc for the threshold rationale. Uses the current env
      # (needs pylint from [dev]).
      - id: pylint-duplicate-code
        name: pylint duplicate-code (src/geopulse/ only)
        entry: pylint --rcfile=.pylintrc src/geopulse/
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # 0.7 gitlint (SOFT mode): commit-message convention warning. This
      # hook ALWAYS exits 0 — it prints the gitlint output as a warning
      # but never blocks the commit. CI runs the same check in HARD mode
      # (see .github/workflows/ci.yml) so malformed messages can't reach
      # main, but a first-time contributor can commit locally without
      # tripping over Conventional Commits mechanics on day one.
      - id: gitlint-soft
        name: gitlint (commit message — warn only, CI enforces)
        entry: bash -c 'gitlint --msg-filename "$1" || (echo; echo "⚠️  Commit message may not match Conventional Commits — CI will enforce."; echo "   See CONTRIBUTING.md § Commit message conventions."); exit 0'
        language: system
        stages: [commit-msg]
        always_run: true

      # 1. Cleanup: strip build artefacts before every commit. All already
      # gitignored so this only affects the working tree — keeps `ls` and
      # `git status` clean without changing any tracked file.
      - id: clean-build-artefacts
        name: clean build artefacts (dist/, build/, egg-info, docs/_build/)
        entry: bash -c 'rm -rf dist build docs/_build docs/api/_autosummary *.egg-info src/*.egg-info .pytest_cache .mypy_cache'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # 2. Wheel + sdist smoke check: verify `python -m build` still succeeds.
      # Runs only on `git push` so day-to-day commits stay fast. Catches
      # packaging breakage (missing MANIFEST files, bad pyproject changes)
      # BEFORE it hits CI or PyPI.
      - id: build-wheel-check
        name: build wheel + sdist (smoke check)
        entry: bash -c 'python -m build --outdir /tmp/gp_prepush_dist > /tmp/gp_prepush_build.log 2>&1 && rm -rf /tmp/gp_prepush_dist'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 3. Sphinx docs smoke check: verify the site still builds. Runs only
      # on push. Doesn't use -W (RTD tolerates warnings and so should we);
      # a real BUILD failure still fails this hook.
      - id: build-docs-check
        name: sphinx-build docs (smoke check)
        entry: bash -c 'sphinx-build -b html -q docs /tmp/gp_prepush_docs > /tmp/gp_prepush_docs.log 2>&1 && rm -rf /tmp/gp_prepush_docs'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
