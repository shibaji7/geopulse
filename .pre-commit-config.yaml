repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match the dev env (local ruff is 0.16.0). Bump both together
    # when refreshing; `pre-commit autoupdate` handles this hook automatically.
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # Match the CI invocation: mypy src/geopulse/ --ignore-missing-imports.
        # files=/args scope the run to src/ only so tests (which are noisier)
        # don't gate every commit.
        files: ^src/geopulse/
        args: [--ignore-missing-imports]
