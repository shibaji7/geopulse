name: geopulse-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - h5py>=3.8
  - pyyaml>=6.0
  # --- dev tools ---
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff>=0.4
  - mypy>=1.5
  - pre-commit>=3.3
  - sphinx>=7.0
  - jupyter
  - ipykernel
  # --- pip-only deps ---
  - pip
  - pip:
    - loguru>=0.7
    - sphinx-autodoc-typehints>=1.24
    - towncrier>=23.6
    - -e ".[dev]"
