[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopulse"
# Version is derived at build time from src/geopulse/_version.py — see
# [tool.setuptools.dynamic] below. Bumping the version means editing
# _version.py ONLY; nothing else needs to change.
dynamic = ["version"]
description = "Unified engine for geomagnetically induced currents across grounded infrastructure"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Shibaji Chakraborty", email = "chakras2@erau.edu"},
    {name = "Xueling Shi"},
    {name = "Michael Hartinger"},
    {name = "David Boteler"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
keywords = ["GIC", "space-weather", "geomagnetically-induced-currents", "telluric",
            "submarine-cable", "pipeline", "power-grid", "impedance"]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
data = [
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "pandas>=2.0",
]
viz = [
    "cartopy>=0.21",
    "geopandas>=0.13",
    "shapely>=2.0",
]
earth3d = [
    "SimPEG>=0.20",
]
spice = [
    "PySpice>=1.5",
]
service = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
    "ruff>=0.4",
    "mypy>=1.5",
    "pre-commit>=3.3",
    # Guardrails — see CONTRIBUTING.md § "Guardrail hooks".
    "interrogate>=1.7",   # docstring-coverage percentage gate
    "pylint>=3.0",        # narrowly-scoped: duplicate-code detection only
    "gitlint>=0.19",      # commit-message convention (Conventional Commits)
    # Docs + release tooling.
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "sphinx-autodoc-typehints>=1.24",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "towncrier>=23.6",
    "build>=1.0",
    "twine>=5.0",
]
docs = [
    # Standalone extra so Read the Docs can install only what the build needs.
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "sphinx-autodoc-typehints>=1.24",
    "myst-parser>=2.0",
]
all = [
    "geopulse[data,viz,earth3d,spice,service,dev]",
]

[project.urls]
Homepage      = "https://github.com/shibaji7/geopulse"
Documentation = "https://geopulse.readthedocs.io"
"Source Code" = "https://github.com/shibaji7/geopulse"
"PyPI"        = "https://pypi.org/project/geopulse/"
Issues        = "https://github.com/shibaji7/geopulse/issues"
Changelog     = "https://github.com/shibaji7/geopulse/blob/main/CHANGELOG.md"
Releases      = "https://github.com/shibaji7/geopulse/releases"

[project.scripts]
geopulse = "geopulse.cli:main"

[project.entry-points."geopulse.earth_models"]
layered_1d = "geopulse.earth.layered_1d:Layered1D"

[project.entry-points."geopulse.solvers"]
nam = "geopulse.solver.nam:NAMSolver"

[project.entry-points."geopulse.networks"]
cable = "geopulse.network.cable:CableNetwork"
powergrid = "geopulse.network.powergrid:PowerGridNetwork"
pipeline = "geopulse.network.pipeline:PipelineNetwork"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geopulse = ["py.typed"]

[tool.setuptools.dynamic]
# Single source of truth for the version. Bumping src/geopulse/_version.py
# is the ONLY step needed to change the released version; setuptools reads
# __version__ at build time and stamps it into the wheel / sdist metadata.
version = {attr = "geopulse._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (run with --runslow)",
    "benchmark: marks performance benchmarks (run with --runbench)",
    "integration: marks integration tests",
]
addopts = "-v --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:h5py",
]

[tool.coverage.run]
source = ["src/geopulse"]
branch = true
# Kept short by design. Pure "raise NotImplementedYetError" stubs are
# handled by the exclude_lines rule below (no need to also omit the
# whole file). Only file-level omits that stay here are:
#   * _version.py             — trivially uninteresting (version literal),
#   * earth/unstructured_3d.py — will grow into real physics; measuring
#                                 partial coverage while it is being
#                                 written would be misleading,
#   * solver/sparse.py        — same story (real math will land in
#                                 stages, not one big drop).
omit = [
    "src/geopulse/_version.py",
    "src/geopulse/earth/unstructured_3d.py",
    "src/geopulse/solver/sparse.py",
]

[tool.coverage.report]
# Fail the coverage job if line coverage of the implemented modules drops
# below this floor. Raised from 75 -> 80 after the omit cleanup; current
# measured coverage on `main` sits at ~85% so this leaves a small headroom.
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedYetError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
