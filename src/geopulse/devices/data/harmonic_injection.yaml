# Placeholder harmonic-injection lookup table for GIC-driven half-cycle
# saturation. Keyed by transformer core type (see geopulse.devices.transformer
# CoreType) and evaluated by piecewise-linear interpolation on
# effective per-phase DC current |I_eff| in amperes.
#
# Values give the injected harmonic current as a percentage of the
# fundamental at each breakpoint. Fundamental (order 1) is defined as
# 100.0 % and is not stored here — the module fills it in.
#
# WARNING (spec §6.3, §10 item 2):
# ================================================================
# These values are ORDER-OF-MAGNITUDE placeholders. The qualitative
# structure is right:
#   * every entry is zero at I_eff = 0,
#   * even harmonics (2nd, 4th) dominate over odd (3rd, 5th) at
#     equal saturation depth — the asymmetric-saturation signature
#     specific to GIC, and the mechanism behind the Hydro-Québec 1989
#     collapse (harmonic-driven SVC trips),
#   * susceptibility rises with core-type index in the same order as
#     the reactive-absorption K factors:
#       three-limb  <  five-limb  <  shell-form  <  single-phase bank
# but the absolute values MUST be recalibrated against the GIC
# literature (Kappenman; Overbye & Shetye; NERC TPL-007 committee)
# before any published result. Edit this file — no code change needed.
#
# AUTOTRANSFORMER is deliberately absent (spec §10 item 3). Callers
# must supply an explicit table via the analytical hook once that
# work-package lands.
# ================================================================

three_limb_core:
  breakpoints_A: [0.0,  5.0, 10.0, 20.0, 50.0]
  order_2_pct:   [0.0,  0.8,  1.6,  3.2,  6.4]
  order_3_pct:   [0.0,  0.3,  0.6,  1.2,  2.4]
  order_4_pct:   [0.0,  0.4,  0.9,  1.8,  3.6]
  order_5_pct:   [0.0,  0.2,  0.4,  0.8,  1.6]

five_limb_core:
  breakpoints_A: [0.0,  5.0, 10.0, 20.0, 50.0]
  order_2_pct:   [0.0,  1.5,  3.0,  6.0, 12.0]
  order_3_pct:   [0.0,  0.5,  1.0,  2.0,  4.0]
  order_4_pct:   [0.0,  0.8,  1.6,  3.2,  6.4]
  order_5_pct:   [0.0,  0.3,  0.6,  1.2,  2.4]

shell_form:
  breakpoints_A: [0.0,  5.0, 10.0, 20.0, 50.0]
  order_2_pct:   [0.0,  2.0,  4.0,  8.0, 16.0]
  order_3_pct:   [0.0,  0.7,  1.4,  2.8,  5.6]
  order_4_pct:   [0.0,  1.1,  2.2,  4.4,  8.8]
  order_5_pct:   [0.0,  0.4,  0.8,  1.6,  3.2]

single_phase_bank:
  breakpoints_A: [0.0,  5.0, 10.0, 20.0, 50.0]
  order_2_pct:   [0.0,  2.5,  5.0, 10.0, 20.0]
  order_3_pct:   [0.0,  0.9,  1.8,  3.6,  7.2]
  order_4_pct:   [0.0,  1.4,  2.8,  5.6, 11.2]
  order_5_pct:   [0.0,  0.5,  1.0,  2.0,  4.0]
